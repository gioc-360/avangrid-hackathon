<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EWU Demo</title>
<style>
/* palette from the team deck (greens #008c38 #0b3b30, blue #0089bd, orange #c46a00, neutrals #1d2b24 #d5ded8 #eef5f0).
   dataviz palette script, 2026-11-13: over/upgrade (orange) vs protected (dark green) and the load series pass CVD;
   shifted (green) vs over (orange) fails protan, so it rests on secondary encoding: every state has its own shape and word */
:root {
  --bg: #f7faf8; --panel: #eef5f0; --card: #ffffff; --ink: #1d2b24; --muted: #4a5651; --faint: #5f6b66; --line: #d5ded8;
  --wire: #a0aaa5; --node: #a0aaa5;
  --base: #a0aaa5; --ev: #0089bd; --hp: #8cc63f; --summer: #c46a00; --shift: #008c38; --protect: #0b3b30; --upgrade: #c46a00; --limit: #c4452b;
  --soc: #0b3b30; --chip: #eef5f0; --accent: #008c38; --focus: #0089bd; --ctl: #5f6b66;
  --lift: 0 1px 2px rgba(29, 43, 36, .06), 0 4px 14px rgba(29, 43, 36, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1714; --panel: #14201b; --card: #1a2721; --ink: #e8f0eb; --muted: #b4c0ba; --faint: #9aa6a0; --line: #2e3d36;
    --wire: #5f6b66; --node: #6f7b76;
    --base: #8a9690; --ev: #4fc3f0; --hp: #8cc63f; --summer: #f7a84a; --shift: #16b161; --protect: #b9e4c9; --upgrade: #f7a84a; --limit: #e0623e;
    --soc: #b9e4c9; --chip: #22302a; --accent: #16b161; --focus: #4fc3f0; --ctl: #6f7b76;
    --lift: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: auto; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }

/* side panel: app name and the views in order; the ladder views sit between two quiet rules */
aside.side { background: var(--panel); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; padding: 20px 14px 16px; }
.appname { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; padding: 0 10px 14px; }
aside.side ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
aside.side li.group { border-top: 1px solid var(--line); margin: 10px 10px 6px; }
aside.side a.step-link { display: block; text-decoration: none; color: var(--ink); padding: 6px 10px 6px 12px; border-radius: 6px;
  border-left: 3px solid transparent; }
aside.side a.step-link:hover { background: var(--chip); }
aside.side a.step-link .name { display: block; font-weight: 500; font-size: 18px; }
aside.side a.step-link[aria-current="page"] { background: var(--card); border-left-color: var(--accent); box-shadow: var(--lift); }
aside.side a.step-link[aria-current="page"] .name { font-weight: 700; }

main { padding: 24px 36px 48px; max-width: 1640px; min-width: 0; }
.step { display: none; }
.step.show { display: block; }
.eyebrow { color: var(--muted); margin: 0 0 6px; font-size: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.eyebrow b { color: var(--ink); }
.headline { font-size: 30px; font-weight: 650; line-height: 1.25; margin: 0 0 14px; max-width: 1200px; letter-spacing: -0.015em; }
.big { font-size: 48px; font-weight: 750; letter-spacing: -0.02em; line-height: 1; margin-right: 4px; }
.big .n { font-weight: 750; }
.card { background: var(--card); border-radius: 10px; box-shadow: var(--lift); padding: 18px 20px; margin: 0 0 16px; }
.row { display: flex; gap: 28px; flex-wrap: wrap; }
.col { flex: 1 1 340px; min-width: 0; }
.controls { display: flex; gap: 8px 20px; flex-wrap: wrap; margin: 0 0 14px; align-items: center; }
.controls .grp { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.controls .label { color: var(--muted); margin-right: 2px; }
button { font: inherit; font-size: 18px; color: var(--ink); background: var(--card); border: 1px solid var(--ctl); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); font-weight: 600; }
.n { font-variant-numeric: tabular-nums; font-weight: 600; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 12px; }
table { border-collapse: collapse; width: 100%; }
td, th { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { color: var(--muted); font-weight: 500; font-size: 16px; }
td.num { text-align: right; white-space: nowrap; }
tr.on td { font-weight: 600; }
.key { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
svg { width: 100%; height: auto; display: block; }
svg.chart { max-width: 1100px; }
svg text { fill: var(--muted); font-size: 12px; }
.sub { color: var(--muted); margin: 0 0 6px; }
.legend { display: flex; gap: 6px 20px; flex-wrap: wrap; color: var(--muted); margin: 0 0 6px; }
.legend .dim .key { opacity: .3; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin: 0 0 16px; }
a.tile { display: block; text-decoration: none; color: var(--ink); background: var(--card); border-radius: 10px; box-shadow: var(--lift);
  padding: 12px 14px; border-top: 3px solid var(--line); }
a.tile:hover { background: var(--chip); }
a.tile .tname { display: block; color: var(--muted); font-weight: 600; }
a.tile .tnum { display: block; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; margin: 2px 0; }
a.tile .tnum .n { font-weight: 700; }
a.tile .tsub { display: block; color: var(--muted); line-height: 1.3; }

/* one disclosure per view holds every assumption, method, source and caveat; closed by default */
details.how { margin: 18px 0 0; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
details.how summary { cursor: pointer; color: var(--ink); font-weight: 600; width: fit-content; }
details.how p, details.how li { margin: 8px 0 0; max-width: 92ch; }
details.how ul { margin: 0; padding-left: 22px; }
details.how code { font-size: 16px; background: var(--chip); padding: 0 4px; border-radius: 4px; }
/* the one marker app-wide for a number that rests on an assumption or placeholder: it opens the disclosure */
button.est { font-size: 13px; font-weight: 600; vertical-align: super; line-height: 1; padding: 1px 5px; margin-left: 3px;
  border: 1px solid var(--ctl); border-radius: 4px; background: transparent; color: var(--muted); letter-spacing: 0.02em; }
button.tag { font-size: 18px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--chip); border: 1px dashed var(--ctl); color: var(--ink); }
a.next { display: inline-block; margin-top: 18px; color: var(--accent); font-weight: 600; text-decoration: none; }
a.next:hover { text-decoration: underline; }
.notbuilt { color: var(--upgrade); font-weight: 600; }

/* network view: the one-line diagram is the page */
.ladder { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ladder button { padding: 6px 14px; font-weight: 600; }
.netbar { display: flex; gap: 10px 24px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin: 0 0 12px; }
.counts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.counts button { display: inline-flex; align-items: center; gap: 6px; border-color: var(--line); background: var(--card); }
.counts svg { width: 16px; height: 16px; display: inline-block; }
.netgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.netgrid.open { grid-template-columns: minmax(0, 1fr) 430px; }
.netcard { padding: 10px 12px; }
svg.net { cursor: pointer; }
svg.net text { fill: var(--ink); font-size: 18px; }
svg.net text.feeder { font-weight: 600; font-size: 18px; }
.netgrid.open svg.net text { font-size: 26px; }
.detail svg text { font-size: 19px; }
.g-within { fill: var(--node); }
.g-over, .g-upgrade { fill: var(--upgrade); }
.g-upgrade { stroke: var(--ink); stroke-width: 2.4; }
.g-shifted { fill: var(--shift); }
.g-protected { fill: var(--protect); }
.detail h3 { margin: 0; font-size: 22px; }
.detail .dhead { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.detail .state { display: flex; align-items: center; gap: 8px; font-weight: 600; margin: 8px 0 10px; }
.detail .state svg { width: 18px; height: 18px; }
.detail dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 8px 0 10px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; text-align: right; }
.detail .fix { margin: 10px 0 0; }
.detail .nav { display: flex; gap: 8px; margin-top: 12px; }
/* no motion: views swap in place, nothing slides, bounces or counts up; this guard keeps it so */
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

@media (max-width: 1200px) { .netgrid.open { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) {
  .app { display: block; }
  aside.side { position: sticky; top: 0; z-index: 2; height: auto; padding: 8px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
  .appname { padding: 0 0 6px; font-size: 16px; }
  aside.side ol { flex-direction: row; overflow-x: auto; gap: 4px; }
  aside.side li.group { display: none; }
  aside.side a.step-link { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; padding: 4px 10px; }
  aside.side a.step-link[aria-current="page"] { border-bottom-color: var(--accent); }
  main { padding: 18px 16px 40px; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .big { font-size: 36px; }
  .headline { font-size: 24px; }
}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <a class="appname" href="#step=deck">Electrify Without Upgrade</a>
  <nav aria-label="Views">
    <ol>
      <li><a class="step-link" href="#step=deck" data-step="deck"><span class="name">Deck</span></a></li>
      <li class="group" aria-hidden="true"></li>
      <li><a class="step-link" href="#step=network" data-step="network"><span class="name">Network</span></a></li>
      <li><a class="step-link" href="#step=overview" data-step="overview"><span class="name">Overview</span></a></li>
      <li><a class="step-link" href="#step=inventory" data-step="inventory"><span class="name">Inventory</span></a></li>
      <li class="group" aria-hidden="true"></li>
      <li><a class="step-link" href="#step=flag" data-step="flag"><span class="name">Flag</span></a></li>
      <li><a class="step-link" href="#step=shift" data-step="shift"><span class="name">Shift</span></a></li>
      <li><a class="step-link" href="#step=protect" data-step="protect"><span class="name">Protect</span></a></li>
      <li><a class="step-link" href="#step=upgrade" data-step="upgrade"><span class="name">Upgrade</span></a></li>
      <li class="group" aria-hidden="true"></li>
      <li><a class="step-link" href="#step=money" data-step="money"><span class="name">Money</span></a></li>
    </ol>
  </nav>
</aside>
<main>
  <section class="step" id="deck" aria-labelledby="h-deck"><div class="body"></div></section>
  <section class="step" id="network" aria-labelledby="h-network"><div class="body"></div></section>
  <section class="step" id="overview" aria-labelledby="h-overview"><div class="body"></div></section>
  <section class="step" id="inventory" aria-labelledby="h-inventory"><div class="body"></div></section>
  <section class="step" id="flag" aria-labelledby="h-flag"><div class="body"></div></section>
  <section class="step" id="shift" aria-labelledby="h-shift"><div class="body"></div></section>
  <section class="step" id="protect" aria-labelledby="h-protect"><div class="body"></div></section>
  <section class="step" id="upgrade" aria-labelledby="h-upgrade"><div class="body"></div></section>
  <section class="step" id="money" aria-labelledby="h-money"><div class="body"></div></section>
</main>
</div>
<script type="application/json" id="data">/*DATA*/</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const V = D.values;
const S = { step: "deck", prof: "deck", net: "flag", t: -1, home: 0, scenario: V["config:demo.scenario"], grouping: "random", margin: Math.max(0, V["config:transformer.sizing_margins"].indexOf(V["config:demo.margin"])), hosts: 0 };
const WORDS = { ev_home: "EV home", electric_heat: "Electric heat", dual_electrified: "EV and electric heat",
  summer_peaker: "Summer peaker", solar: "Solar", baseline: "Baseline", ac: "Air conditioning", ac_central: "Central AC",
  heat_pump: "Heat pump", resistance_heat: "Resistance heat", ev_l2: "Fast home EV charger", ev_l1: "Slow EV charging from an outlet",
  solar_battery: "Solar with battery", pool: "Pool pump", hot_tub: "Hot tub", water_heater: "Electric water heater",
  other_seasonal: "Part-year home", other_inactive: "Inactive meter", other_flat_large: "Large flat load",
  managed_charging: "Managed EV charging", service_upgrade_watch: "Service upgrade watch list",
  winter_demand_response: "Winter demand response", heat_pump_conversion: "Heat pump conversion",
  smart_thermostat: "Smart thermostat", pool_pump_timer: "Pool pump timer", solar_plus_storage: "Solar plus storage",
  home_battery: "Home battery", moderate: "Moderate", high: "High", random: "Random neighbors", same_segment: "Same-segment neighbors" };
const word = k => WORDS[k] || k.replace(/_/g, " ");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// the views in panel order; `needs` names the data groups (demo_page.NEEDS) a view draws from
const STEPS = [
  { id: "deck", name: "Deck", needs: ["deck"], fn: stepDeck },
  { id: "network", name: "Network", needs: ["network"], fn: stepNetwork },
  { id: "overview", name: "Overview", needs: ["screen", "money"], fn: stepOverview },
  { id: "inventory", name: "Inventory", needs: ["inventory"], fn: stepInventory },
  { id: "flag", name: "Flag", needs: ["screen"], fn: stepFlag },
  { id: "shift", name: "Shift", needs: ["screen"], fn: stepShift },
  { id: "protect", name: "Protect", needs: ["screen", "coldsnap"], fn: stepProtect },
  { id: "upgrade", name: "Upgrade", needs: ["screen"], fn: stepUpgrade },
  { id: "money", name: "Money", needs: ["money"], fn: stepMoney },
];
const LEGACY = { 1: "inventory", 2: "flag", 3: "protect", 4: "money" };   // old #step=N and #only=N links
const NET_VIEWS = [["today", "Today"], ["flag", "2030: Flag"], ["shift", "+ Shift"], ["protect", "+ Protect"], ["upgrade", "+ Upgrade"]];
// the Network view's setups: the deck profile (default, battery-only ladder), its optional managed charging run, and
// the cautious setup (earlier method); each names its count facts (f), private per-transformer arrays (t) and ladder
const DECK_VIEWS = [["today", "Today"], ["flag", "2030: Flag"], ["protect", "+ Protect (batteries)"], ["upgrade", "+ Upgrade"]];
const NET_SRC = {
  deck: { f: `fact:ewu.deck.network.${V["config:demo.scenario"]}.`, t: "private:ewu.deck.network.t.", meta: "fact:ewu.deck.network.", views: DECK_VIEWS },
  managed: { f: `fact:ewu.deck.network_managed.${V["config:demo.scenario"]}.`, t: "private:ewu.deck.network_managed.t.", meta: "fact:ewu.deck.network_managed.", views: DECK_VIEWS },
  cautious: { f: "fact:ewu.network.", t: "private:ewu.network.t.", meta: "fact:ewu.network.", views: NET_VIEWS },
};
const hasProf = p => NET_SRC[p] && V[NET_SRC[p].t + "state"] != null;

function val(key, index) { const v = V[key]; return index == null ? v : (v == null ? undefined : v[index]); }
function N(key, d = 2, o = {}) {
  const raw = val(key, o.index);
  const shown = typeof raw === "number" ? (raw * (o.scale || 1)).toLocaleString("en-US",
    { minimumFractionDigits: d, maximumFractionDigits: d }) : String(raw);
  const idx = o.index == null ? "" : ` data-index="${o.index}"`;
  return `${o.pre || ""}<span class="n" data-key="${key}"${idx} title="${key}${o.index == null ? "" : "[" + o.index + "]"}">${shown}</span>${o.post || ""}`;
}
const margins = () => V["config:transformer.sizing_margins"];
const mlabel = i => "margin_" + Math.round(margins()[i] * 100);
const cell = () => `${S.scenario}.${S.grouping}.${mlabel(S.margin)}`;
const C = () => `fact:ewu.sensitivity.${cell()}.`;
const btn = (on, set, html) => `<button type="button" aria-pressed="${on}" onclick='go(${JSON.stringify(set)})'>${html}</button>`;
const sizeKey = (i, field) => `fact:ewu.sensitivity.${S.scenario}.${S.grouping}.${mlabel(i)}.${field}`;

function go(set) {
  const keep = document.activeElement && document.activeElement.classList.contains("net");   // the diagram keeps focus for arrow keys
  Object.assign(S, set); writeHash(); render();
  if (keep) { const svg = document.querySelector("section.show svg.net"); if (svg) svg.focus(); }
}
function writeHash() {
  history.replaceState(null, "", `#step=${S.step}&prof=${S.prof}&net=${S.net}&t=${S.t}&home=${S.home}&scenario=${S.scenario}&grouping=${S.grouping}&margin=${S.margin}&hosts=${S.hosts}`);
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  for (const k of ["home", "margin", "hosts", "t"]) if (p.has(k)) S[k] = parseInt(p.get(k), 10);
  for (const k of ["home", "margin", "hosts"]) if (!(S[k] >= 0)) S[k] = 0;
  if (!(S.t >= 0)) S.t = -1;
  for (const k of ["scenario", "grouping"]) if (p.has(k)) S[k] = p.get(k);
  if (p.has("prof") && hasProf(p.get("prof"))) S.prof = p.get("prof");
  if (p.has("net") && NET_SRC[S.prof].views.some(([v]) => v === p.get("net"))) S.net = p.get("net");
  const step = p.get("step") || p.get("only");
  if (step) S.step = LEGACY[step] || (STEPS.some(s => s.id === step) ? step : "deck");
}

// "How this is computed": one closed disclosure per view; `est` marks a number that rests on it and opens it
const OPEN = new Set();
const how = (id, html) => `<details class="how" id="how-${id}"${OPEN.has(id) ? " open" : ""} ontoggle="this.open ? OPEN.add('${id}') : OPEN.delete('${id}')"><summary>How this is computed</summary>${html}
  <p>Every number comes from a stored fact or config/ewu.yaml; hover a number for its key.</p></details>`;
const est = id => `<button type="button" class="est" onclick="openHow('${id}')" aria-label="Estimate: open How this is computed">est.</button>`;
function openHow(id) { const d = document.getElementById("how-" + id); if (d) { d.open = true; d.scrollIntoView({ block: "nearest" }); } }

function line(series, w, h, lo, hi, color, dash) {
  const x = i => (i * w / (series.length - 1)).toFixed(1), y = v => (h - (v - lo) / (hi - lo) * h).toFixed(1);
  return `<polyline fill="none" stroke="${color}" stroke-width="2" ${dash ? 'stroke-dasharray="5 4"' : ""} points="${series.map((v, i) => x(i) + "," + y(v)).join(" ")}"/>`;
}
// horizontal bar: parts are [value, colour, opacity]; drawn against `total`
function hbar(parts, total, height) {
  let x = 0, out = "";
  for (const [v, col, op] of parts) { const w = Math.max(0, 600 * v / total); out += `<rect x="${x.toFixed(1)}" y="0" width="${w.toFixed(1)}" height="${height}" fill="${col}" opacity="${op == null ? 1 : op}"/>`; x += w; }
  return `<svg viewBox="0 0 600 ${height}" preserveAspectRatio="none" role="img" aria-hidden="true" style="height:${height}px;margin:6px 0 8px;border-radius:5px;background:var(--chip)">${out}</svg>`;
}

// ---------- Network: the demo screen's own synthetic network, one substation, its feeders, every transformer
const T = name => V[NET_SRC[S.prof].t + name];
const LOOK_WORD = { within: "Within limit", over: "Over limit", shifted: "Shifted", protected: "Battery protected", upgrade: "New transformer" };
const GLYPH = {
  within: '<circle class="g-within" r="3.4"/>',
  over: '<path class="g-over" d="M0,-6.2L5.6,4.2L-5.6,4.2Z"/>',
  shifted: '<circle class="g-shifted" r="5"/>',
  protected: '<path class="g-protected" d="M-6,-3.8h10.4v7.6h-10.4ZM4.4,-1.8h2v3.6h-2Z"/>',
  upgrade: '<rect class="g-upgrade" x="-6.6" y="-6.6" width="13.2" height="13.2"/>',
};
const glyph = (look, size = 16) => `<svg viewBox="-8.5 -8.5 17 17" width="${size}" height="${size}" aria-hidden="true">${GLYPH[look]}</svg>`;
// state word per transformer at one step of the ladder; ewu/network.py looks() is the same rule
function look(i, view) {
  const s = T("state")[i];
  if (view === "today") return T("over_today")[i] ? "over" : "within";
  if (view === "flag") return T("flag")[i] ? "over" : "within";
  if (s === 0) return "within";
  if (s === 1) return "shifted";
  if (s === 2) return view === "shift" ? "over" : "protected";
  return view === "upgrade" ? "upgrade" : "over";
}
// layout: substation left, a bus, one trunk per feeder, laterals of 4 transformers above and below the trunk
// BUS is the substation bus bar; X0 leaves room for a feeder label at the drill-down's larger text size
const NW = 1500, NH = 780, BUS = 180, X0 = 330, X1 = 1488, TOP = 16;
let LAYOUT = null;
function layout() {
  if (LAYOUT && LAYOUT.prof === S.prof) return LAYOUT;
  const feeder = T("feeder"), nf = Math.max(...feeder) + 1, band = (NH - 2 * TOP) / nf, seen = new Array(nf).fill(0);
  const per = new Array(nf).fill(0); feeder.forEach(f => per[f]++);
  const laterals = Math.ceil(Math.max(...per) / 8), pitch = (X1 - X0) / Math.max(1, laterals - 1);
  const pos = feeder.map(f => {
    const j = seen[f]++, side = j % 8 < 4 ? -1 : 1, k = j % 4;
    return [X0 + Math.floor(j / 8) * pitch, TOP + band * (f + 0.5) + side * (12 + k * 12)];
  });
  LAYOUT = { nf, band, pos, per, pitch, prof: S.prof };
  return LAYOUT;
}

    ${TAG("ASSUMED", `overloaded above ${N("config:profiles.deck.overload_limit", 0, { scale: 100, post: "%" })} of rating in any hour; kW read as kVA; battery unit ${N("config:profiles.deck.battery_unit_usd", 0, { pre: "$" })}, lease ${N("config:profiles.deck.lease_usd_unit_yr", 0, { pre: "$", post: " a year" })}, NYSERDA ${N("config:profiles.deck.nyserda_usd_unit", 0, { pre: "$" })}, ${N("config:profiles.deck.years", 0, { post: " years" })} at ${N("config:profiles.deck.discount_rate", 0, { scale: 100, post: "%" })}; upgrade ${N("config:profiles.deck.upgrade_usd", 0, { pre: "$" })} counted for ${N("config:profiles.deck.years", 0)} of its ${N("config:profiles.deck.upgrade_life_years", 0, { post: " years" })}; NYSEG as ${N("config:prices.nyseg_electric_customers", 0)} customers on ${N("config:profiles.deck.homes_per_transformer", 0)}-home transformers.</p>
    <p>Avangrid cost is units net of the customer lease and NYSERDA; gross is ${N(DK("moderate", "nyseg_gross_musd"), 1, { pre: "$", post: "M" })} and ${N(DK("high", "nyseg_gross_musd"), 1, { pre: "$", post: "M" })}, so the saving rests on the lease and the incentive. Peak cut with export is today's yearly peak minus the new one; behind the meter only, ${N("fact:ewu.deck.peakcut.behind_meter_mw", 2, { post: " MW" })} over the top hours.`)}`)}`;
}

function stepOverview() {
  const c = C(), m = `fact:ewu.economics.${cell()}.mid.discounted.`, h = "fact:ewu.economics.headline.";
  const tile = (id, col, name, num, sub) => `<a class="tile" href="#step=${id}" style="border-top-color:${col}"><span class="tname">${name}</span><span class="tnum">${num}</span><span class="tsub">${sub}</span></a>`;
  return `${head("overview", "Overview", `${big(N(c + "upgrade_left_pct", 2, { post: "%" }))} of transformers need a new one in 2030${est("overview")}`)}
  ${caseControls()}
  <div class="card">${ladder(null, false)}</div>
  <div class="tiles">
    ${tile("flag", "var(--ink)", "Flag", N(c + "flagged_pct", 2, { post: "%" }), "over the limit")}
    ${tile("shift", "var(--shift)", "Shift", N(c + "shift_fixed_pct", 2, { post: "%" }), "staggered charging")}
    ${tile("protect", "var(--protect)", "Protect", N(c + "protected_pct", 2, { post: "%" }), "home batteries")}
    ${tile("upgrade", "var(--upgrade)", "Upgrade", N(c + "upgrade_left_pct", 2, { post: "%" }), "need a new transformer")}
    ${tile("money", "var(--accent)", "Money", N(m + "ladder_share_pct", 2, { post: "%" }) + est("overview"), "of upgrading all")}
  </div>
  ${how("overview", `<p>For Avangrid distribution planners at NYSEG and RG&amp;E deciding which neighborhood transformers need what before 2030, and for the customer programs team choosing who to enroll in managed charging or offer a home battery. Homeowners benefit; they do not use this page.</p>
    <p>The ladder, cheapest fix first: Flag finds the transformers over their limit in 2030; Shift staggers their EV charging; Protect adds the fewest home batteries; Upgrade is what is still over. The bar and tiles are shares of all transformers; Money is the plan's cost against upgrading every flagged one.</p>
    <p>Upgrade is ${sizeRange("upgrade_left_pct")} across today's transformer sizing; cheaper fixes cover the rest.</p>
    <p>Money: the plan's cost as a share of upgrading every flagged transformer, ${N(h + "ladder_share_pct.low", 2, { post: "%" })} to ${N(h + "ladder_share_pct.high", 2, { post: "%" })} over every case. Prices are placeholders flagged in config/ewu.yaml.</p>${synthetic()}`)}`;
}

function stepInventory() {
  const k = `fact:ewu.demo.composite_`, count = V["fact:ewu.demo.home_count"];
  let picker = "";
  for (let i = 0; i < count; i++) picker += btn(S.home === i, { home: i }, esc(word(V[k + i + ".segment"])));
  const h = k + S.home, flags = V[h + ".flags"], conf = V[h + ".confidence"], programs = V[h + ".programs"];
  const rows = flags.map((f, i) => `<tr><td>${esc(word(f))}</td><td class="num">${N(h + ".flag_share_pct", 2, { index: i, post: "%" })}</td></tr>`).join("");
  const win = V[h + ".winter_day_kw"], sum = V[h + ".summer_day_kw"], hi = Math.max(...win, ...sum) * 1.1;
  const chips = programs.map((p, i) => `<span class="chip">${esc(word(p))} ${N(h + ".program_share_pct", 2, { index: i, post: "%" })}</span>`).join("");
  return `${head("inventory", "Inventory", `${big(N("fact:ewu.inventory.any_program_pct", 2, { post: "%" }))} of ${N("fact:ewu.inventory.homes", 0)} homes qualify for a program`)}
  <div class="controls"><div class="grp"><span class="label">Segment</span>${picker}</div></div>
  <div class="card"><div class="row"><div class="col">
    <p style="margin:0 0 8px"><b>Composite home, ${esc(word(V[h + ".segment"]))}</b>${est("inventory")}: ${N(h + ".annual_kwh", 0, { post: " kWh a year" })}, peak ${N(h + ".peak_kw", 2, { post: " kW" })}</p>
    <table><tr><th>Equipment</th><th style="text-align:right">Segment homes</th></tr>${rows}</table>
    <p style="margin:14px 0 2px">Programs</p>
    <div class="chips">${programs.length ? chips : '<span class="sub">none</span>'}</div>
  </div><div class="col">
    <div class="legend"><span><span class="key" style="background:var(--ev)"></span>Winter ${N(h + ".winter_day_peak_kw", 2, { post: " kW" })}</span>
      <span><span class="key" style="background:var(--summer)"></span>Summer ${N(h + ".summer_day_peak_kw", 2, { post: " kW" })}</span></div>
    <svg viewBox="0 0 480 170" role="img" aria-label="Average winter and summer day load by hour"><line x1="0" y1="150" x2="480" y2="150" stroke="var(--line)"/>
      <g transform="translate(0,10)">${line(win, 480, 140, 0, hi, "var(--ev)")}${line(sum, 480, 140, 0, hi, "var(--summer)")}</g>
      <text x="0" y="166">00:00</text><text x="240" y="166" text-anchor="middle">12:00</text><text x="480" y="166" text-anchor="end">23:00</text></svg>
  </div></div></div>
  ${how("inventory", `<p>Equipment is read from each home's hourly meter data alone. The Composite home is the average of ${N(h + ".homes", 0, { post: " homes" })} in the segment, not a real customer; Qualify for a program means eligible for at least one. Shares are of the segment's homes (equipment and eligible programs alike), the day curves are average winter and summer days, and the kW beside each day is its highest hour.</p>
    <p>How sure each equipment read is, in this segment: ${flags.map((f, i) => `${esc(word(f))} ${esc(conf[i])}`).join(", ")}.</p>
    <p>Average owner scores in this segment: EV ${N(h + ".p_ev", 0, { scale: 100, post: "%" })}, heat pump ${N(h + ".p_heat_pump", 0, { scale: 100, post: "%" })}. Program rules are this team's reading of the segment actions.</p>`)}`;
}

function stepFlag() {
  const c = C();
  return `${head("flag", "Flag", `${big(N(c + "flagged_pct", 2, { post: "%" }))} of transformers go over their limit in 2030${est("flag")}`)}
  ${caseControls()}
  <div class="card"><p class="sub">By rating</p>${bySizing("flagged_pct")}</div>
  ${how("flag", `<p>EV charging unmanaged. ${sizeRange("flagged_pct")} depending on how big today's transformers are (the rating control).</p>${synthetic()}`)}`;
}

function stepShift() {
  const c = C();
  return `${head("shift", "Shift", `${big(N(c + "shift_fixed_pct", 2, { post: "%" }))} of transformers are fixed by staggering EV charging${est("shift")}`)}
  ${caseControls()}
  <div class="card">${ladder("shift_fixed_pct")}</div>
  <div class="card"><p class="sub">By rating</p>${bySizing("shift_fixed_pct")}</div>
  ${how("shift", `<p>${V[c + "shift_fixed_pct"] * 2 > V[c + "flagged_pct"] ? "Most" : "Less than half"} of the ${N(c + "flagged_pct", 2, { post: "%" })} flagged; the rest go on to Protect or Upgrade. Staggering newly overloads ${N(c + "new_from_stagger_pct", 2, { post: "%" })}, which join them.</p>${synthetic()}`)}`;
}

function stepProtect() {
  const c = C(), hosts = V["config:battery.coldsnap_hosts_per_transformer"], n = hosts[S.hosts];
  const e = "private:ewu.coldsnap.example.", agg = `fact:ewu.coldsnap.${V["config:demo.scenario"]}.staggered.margin_${Math.round(V["config:transformer.base_margin"] * 100)}.`;
  const load = V[e + "load_kw"], net = V[e + `hosts_${n}.net_kw`], med = V[agg + `hosts_${n}.soc_median_pct_by_hour`], p10 = V[agg + `hosts_${n}.soc_p10_pct_by_hour`];
  const limit = V[e + "limit_kw"], hi = Math.max(...load, limit) * 1.08, ly = (220 - limit / hi * 220).toFixed(1);
  const pick = hosts.map((x, i) => btn(S.hosts === i, { hosts: i }, N("config:battery.coldsnap_hosts_per_transformer", 0, { index: i }) + (x === 1 ? " host home" : " host homes"))).join("");
  return `${head("protect", "Protect", `${big(N(c + "protected_pct", 2, { post: "%" }))} of transformers are cleared by home batteries, ${N(c + "batteries_per_protected", 2)} per transformer${est("protect")}`)}
  ${caseControls(`<div class="grp"><span class="label">Hosts</span>${pick}</div>`)}
  <div class="chips"><span class="chip">Cold snap over ${N(agg + "flagged_pct", 2, { post: "%" })}</span><span class="chip">${N("config:battery.coldsnap_hosts_per_transformer", 0, { index: 0 })} host clears ${N(agg + "hosts_1.cleared_pct", 2, { post: "%" })}</span><span class="chip">${N("config:battery.coldsnap_hosts_per_transformer", 0, { index: 1 })} hosts clear ${N(agg + "hosts_2.cleared_pct", 2, { post: "%" })}</span></div>
  <div class="card">
    <p class="sub">One transformer, ${N("config:transformer.homes_per_transformer", 0, { post: " homes summed" })}${est("protect")}</p>
    <div class="legend"><span><span class="key" style="background:var(--base)"></span>Without batteries</span>
      <span><span class="key" style="background:var(--ev)"></span>With batteries</span>
      <span><span class="key" style="background:var(--limit)"></span>Limit ${N(e + "limit_kw", 2, { post: " kW" })}</span></div>
    <svg class="chart" viewBox="0 0 1100 250" role="img" aria-label="Transformer load through the cold snap, with and without batteries, against its limit"><g transform="translate(0,6)">
      <line x1="0" x2="1100" y1="${ly}" y2="${ly}" stroke="var(--limit)" stroke-dasharray="6 4"/>
      ${line(load, 1100, 220, 0, hi, "var(--base)")}${line(net, 1100, 220, 0, hi, "var(--ev)")}</g>
      <text x="0" y="246">2026-02-07</text><text x="550" y="246">2026-02-08</text></svg>
    <p class="sub" style="margin-top:14px">Battery charge, lowest:
      <span class="key" style="background:var(--soc)"></span>median ${N(agg + `hosts_${n}.soc_median_pct_by_hour`, 1, { index: med.indexOf(Math.min(...med)), post: "%" })}
      &nbsp; <span class="key" style="background:var(--soc);opacity:.5"></span>bottom tenth ${N(agg + `hosts_${n}.soc_p10_pct_by_hour`, 1, { index: p10.indexOf(Math.min(...p10)), post: "%" })}</p>
    <svg class="chart" viewBox="0 0 1100 110" role="img" aria-label="Fleet battery charge through the cold snap"><line x1="0" x2="1100" y1="104" y2="104" stroke="var(--line)"/><line x1="0" x2="1100" y1="4" y2="4" stroke="var(--line)"/>
      <g transform="translate(0,4)">${line(med, 1100, 100, 0, 100, "var(--soc)")}${line(p10, 1100, 100, 0, 100, "var(--soc)", true)}</g></svg>
  </div>
  ${how("protect", `<p>Cold snap case: ${esc(word(V["config:demo.scenario"]).toLowerCase())} 2030, staggered EV charging, rating x ${N("config:transformer.base_margin", 2)}, coldest hour ${N("fact:ewu.coldsnap.window_min_temp_f", 1, { post: " F" })}. Each host: ${N("config:battery.units_per_host_max", 0)} battery units, ${N("config:battery.energy_kwh_two_units", 2, { post: " kWh" })}. Chips are shares of transformers over in the two coldest days. The chart is one flagged transformer through the cold snap; Hosts is how many of its homes carry batteries. Battery charge is % of full across every flagged transformer, its lowest hour shown, the bottom tenth dashed.</p>
    <p>With no battery this transformer spends ${N(e + "kwh_over", 2, { post: " kWh" })} over the limit across the two days. Host homes are picked by fit score. The battery runs all year, so its charge on the first cold night is earned, not assumed, and it charges only when the transformer has room under the limit. The cold snap test is run for the case named here; the share cleared in the headline follows the case picked.</p>${synthetic()}`)}`;
}

function stepUpgrade() {
  const c = C();
  return `${head("upgrade", "Upgrade", `${big(N(c + "upgrade_left_pct", 2, { post: "%" }))} of transformers are still over: replace these${est("upgrade")}`)}
  ${caseControls()}
  <div class="card">${ladder("upgrade_left_pct")}</div>
  <div class="card"><p class="sub">By rating</p>${bySizing("upgrade_left_pct")}</div>
  ${how("upgrade", `<p>Still over after staggered EV charging and home batteries. ${sizeRange("upgrade_left_pct")} across today's transformer sizing.</p>${synthetic()}`)}`;
}

function stepMoney() {
  const c = `fact:ewu.economics.${cell()}.`, h = "fact:ewu.economics.headline.", b = "fact:ewu.economics.battery_vs_upgrade.mid.";
  const lad = V[c + "mid.discounted.ladder_share_pct"], stu = V[c + "mid.discounted.shift_then_upgrade_share_pct"], top = Math.max(100, lad, stu);
  const bar = (v, col) => hbar([[v, col]], top, 16);
  return `${head("money", "Money", `The plan costs ${big(N(c + "mid.discounted.ladder_share_pct", 2, { post: "%" }))} of upgrading every flagged transformer${est("money")}`)}
  ${caseControls()}
  <div class="row"><div class="col"><div class="card">
    <p style="margin:0">Upgrade all</p>${bar(100, "var(--upgrade)")}
    <p style="margin:0">Shift + upgrade: ${N(c + "mid.discounted.shift_then_upgrade_share_pct", 2, { post: "%" })}</p>${bar(stu, "var(--shift)")}
    <p style="margin:0">Full plan: ${N(c + "mid.discounted.ladder_share_pct", 2, { post: "%" })}</p>${bar(lad, "var(--protect)")}
  </div></div><div class="col">
    <p style="margin-top:0"><b>${V[b + "battery_yearly_usd"] > V[b + "upgrade_yearly_usd"] ? "Batteries cost more than upgrading." : "Batteries cost less than upgrading."}</b>${est("money")}</p>
    <table><tr><td>Batteries needed</td><td class="num">${N(b + "batteries_per_cleared", 2)}</td></tr>
      <tr><td>Their cost</td><td class="num">${N(b + "battery_yearly_usd", 0, { pre: "$", post: " a year" })}</td></tr>
      <tr><td>Upgrade instead</td><td class="num">${N(b + "upgrade_yearly_usd", 0, { pre: "$", post: " a year" })}</td></tr>
      <tr><td>Tie, per battery unit</td><td class="num">${N(b + "tie_unit_usd_equal_life", 0, { pre: "$" })}</td></tr></table>
  </div></div>
  ${how("money", `<p>${N(h + "ladder_share_pct.low", 2, { post: "%" })} to ${N(h + "ladder_share_pct.high", 2, { post: "%" })} across all ${N("fact:ewu.sensitivity.cells", 0)} grid cells and every price case. ${V[h + "shift_then_upgrade_share_pct.base"] < V[h + "ladder_share_pct.base"] ? "In the base case, shifting is what saves the money; batteries add cost." : "In the base case, batteries add savings on top of shifting."}</p>
    <p>Mid prices. Low prices ${N(c + "low.discounted.ladder_share_pct", 2, { post: "%" })}, high prices ${N(c + "high.discounted.ladder_share_pct", 2, { post: "%" })}; at a zero discount rate ${N(c + "mid.zero_rate.ladder_share_pct", 2, { post: "%" })}.</p>
    <p>Assumptions: prices are placeholders flagged in config/ewu.yaml; battery life ${N("config:battery.life_years", 0, { post: " years" })}, transformer life ${N("config:prices.transformer_life_years", 0, { post: " years" })}, discount rate ${N("config:prices.discount_rate", 0, { scale: 100, post: "%" })}, a placeholder.</p>
    <p>Upgrade all: upgrade every flagged transformer. Shift + upgrade: stagger EV charging, then upgrade what is still over. Full plan: shift, then protect, then upgrade what is still over. The right column sets batteries alone on one transformer they clear against upgrading it: Batteries needed is per transformer cleared, and Tie is the price per battery unit at which the two cost the same. Equal-life cost: a battery wears out before a transformer does, so it is bought again within the transformer's life. Shares are present values against upgrading every flagged transformer, for the case picked.</p>
    <p>Labeled scaling, assumption: if NYSEG's ${N("config:prices.nyseg_electric_customers", 0)} customers were all homes like ours, ${N("fact:ewu.economics.nyseg_transformers", 0)} transformers, the base case is
      ${N("fact:ewu.economics.moderate.random.margin_115.mid.nyseg_upgrade_all_musd", 1, { pre: "$", post: "M" })} to upgrade every flagged one against ${N("fact:ewu.economics.moderate.random.margin_115.mid.nyseg_ladder_musd", 1, { pre: "$", post: "M" })} for the plan, present value.</p>${caseNote()}`)}`;
}

function render() {
  const at = STEPS.findIndex(s => s.id === S.step);
  STEPS.forEach((s, i) => {
    const el = document.getElementById(s.id), missing = s.needs.filter(n => !D.built[n]);
    el.classList.toggle("show", i === at);
    el.querySelector(".body").innerHTML = missing.length
      ? `<p class="notbuilt">not built: ${esc(missing.flatMap(n => D.missing[n]).join(", "))}</p>`
      : s.fn() + (STEPS[i + 1] ? `<a class="next" href="#step=${STEPS[i + 1].id}">Next: ${STEPS[i + 1].name} &rarr;</a>` : "");
  });
  document.querySelectorAll("a.step-link").forEach(a => a.dataset.step === S.step ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.title = `${STEPS[at].name}: EWU Demo`;
}
let shown = null;
function onHash() {
  readHash(); writeHash(); render();
  if (shown && shown !== S.step) window.scrollTo(0, 0);
  shown = S.step;
}
onHash();
window.addEventListener("hashchange", onHash);
</script>
</body>
</html>
