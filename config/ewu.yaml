# Profiles. `deck` (the default) reproduces the final deck from the teammate's alignment spec of 2026-11-13,
# saved verbatim at runs/teammate_deck_spec_2026-11-13.txt; `cautious` is the earlier method, kept as a named
# sensitivity profile: it reads the transformer, scenarios, battery, shift and prices blocks above unchanged.
profiles:
  default: {value: deck, unit: profile name, assumption: true,
            basis: "team decision: the tool reproduces the final deck by default; teammate spec 2026-11-13 (final deck)"}
  cautious:
    rating_rule: {value: "today's group peak x 1.15", unit: rating rule, source: "repo:runs/business_case_team_v2.txt:59",
                  quote: "plus 15%", assumption: true, basis: "the earlier method; the transformer block above holds its inputs"}
    ev_load_rule: {value: measured Level 2 sessions, unit: EV load rule, source: "repo:ewu/adoption.py:40",
                   quote: "measured level 2 sessions", assumption: true,
                   basis: "the earlier method: start and length drawn together from this data's sessions"}
    fix_order: {value: [flag, shift, place, upgrade], unit: steps, source: "repo:README.md:29",
                quote: "flag, shift, place, upgrade", assumption: true, basis: "the earlier method"}
  deck:
    transformer_count: {value: 3000, unit: synthetic transformers, source: "repo:runs/teammate_deck_spec_2026-11-13.txt:5",
                        basis: "teammate spec 2026-11-13 (final deck)"}
    homes_per_transformer: {value: 8, unit: random homes per transformer, source: "repo:runs/teammate_deck_spec_2026-11-13.txt:5",
                            basis: "teammate spec 2026-11-13 (final deck)"}
    seed: {value: 5, unit: random seed, source: "repo:runs/teammate_deck_spec_2026-11-13.txt:5",
           basis: "teammate spec 2026-11-13 (final deck); our generator is not the teammate's, so the same seed draws different homes"}
    standard_sizes_kva: {value: [25, 37.5, 50, 75, 100, 167], unit: kVA, source: "repo:runs/teammate_deck_spec_2026-11-13.txt:6",
                         basis: "teammate spec 2026-11-13 (final deck)"}
    peak_to_rating_divisor: {value: 0.85, unit: today's group peak / this = smallest rating allowed,
                             source: "repo:runs/teammate_deck_spec_2026-11-13.txt:6", basis: "teammate spec 2026-11-13 (final deck)"}
    power_factor: {value: 1.0, unit: kW per kVA, assumption: true,
                   basis: "kW is treated as kVA; no power factor in the data or the spec"}
    above_largest_size: {value: multiple 167 kVA units, unit: rule for a group needing more than the largest size,
                         assumption: true, basis: "the spec lists no size above 167 kVA; the group gets as many 167 kVA units as it needs, counted and logged"}
    overload_limit: {value: 1.20, unit: loading as a multiple of rating, source: "repo:runs/teammate_deck_spec_2026-11-13.txt:3",
                     basis: "teammate spec 2026-11-13 (final deck)"}
    overload_limit_options: {value: [1.00, 1.10, 1.20, 1.40], unit: loading as a multiple of rating,
                             source: "repo:runs/teammate_deck_spec_2026-11-13.txt:3", basis: "teammate spec 2026-11-13 (final deck)"}
    limits_tested: {value: [1.10, 1.20, 1.40], unit: loading limits the battery plan reports and tests, assumption: true,
                    basis: "read from deck v3 (D4G Cornell 2_Final Submission_v3.pptx) slides 28 and 29 (A13), which test 110%, 120% and 140% only; the spec keeps 100% as a sensitivity, so the app shows it as a stricter extra check and docs/DECK_AUDIT_NOTES.md records that the deck does not"}
    ev_excluded_flags: {value: [is_ev_l2], unit: inventory flags that already count as an EV home, assumption: true,
                        basis: "teammate excludes homes flagged High or Medium EV (spec line 8); our inventory has Level 2 (confidence high) and Level 1 (confidence low), no medium tier, so only Level 2 is excluded"}
    hp_excluded_flags: {value: [is_electric_heat], unit: inventory flags that already count as primary electric heat,
                        source: "repo:runs/teammate_deck_spec_2026-11-13.txt:10", quote: "without primary electric heat",
                        basis: "teammate spec 2026-11-13 (final deck)"}
    ev_kw: {value: 7.2, unit: kW per new EV charge, source: "repo:runs/teammate_deck_spec_2026-11-13.txt:9",
            basis: "teammate spec 2026-11-13 (final deck)"}
    ev_hours: {value: 3, unit: hours per charge, source: "repo:runs/teammate_deck_spec_2026-11-13.txt:9",
               basis: "teammate spec 2026-11-13 (final deck)"}
    ev_day_share: {value: 0.47, unit: share of days a new EV charges, source: "repo:runs/teammate_deck_spec_2026-11-13.txt:9",
                   basis: "teammate spec 2026-11-13 (final deck)"}
    teammate_folder: {value: ~/Downloads/_prototype, unit: folder bin/ewu arrays reads the two arrays from (read only, untrusted),
                      assumption: true, basis: "where the teammate's prototype was downloaded on 2026-11-13; nothing in it is run or changed"}
    ev_start_pmf_file: {value: ev_start_pmf.npy, unit: file in data/processed, source: "repo:runs/teammate_deck_spec_2026-11-13.txt:9",
