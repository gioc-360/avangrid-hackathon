# Every input to the EWU prototype, in one place.
# Each input is {value, unit, source} or {value, unit, assumption: true, basis}; it may carry both.
# checks/config_check.py opens every source and fails unless the value (or `quote`) is really there.
# Source forms:
#   repo:PATH:LINE    the value, or the quote, appears on that line of a repo file
#   fact:KEY          the value equals facts/facts.json KEY
#   pdf:DOC:PAGE      the value, or the quote, appears on that page (DOC named in checks/requirements.yaml)
#   citation:ID       the value is listed for that page-verified citation in checks/citations.yaml
# assumption: true means nobody outside this team has confirmed the value; `basis` says where it came from.

scenarios:
  moderate:
    ev_share: {value: 0.20, unit: share of homes adding an EV by 2030, source: "repo:runs/business_case_team_v2.txt:6",
               assumption: true, basis: "teammate scenario; said to follow New York 2030 targets, not verified"}
    hp_share: {value: 0.15, unit: share of homes adding a heat pump by 2030, source: "repo:runs/business_case_team_v2.txt:6",
               assumption: true, basis: "teammate scenario; said to follow New York 2030 targets, not verified"}
  high:
    ev_share: {value: 0.35, unit: share of homes adding an EV by 2030, source: "repo:runs/business_case_team_v2.txt:7",
               assumption: true, basis: "teammate scenario; said to follow New York 2030 targets, not verified"}
    hp_share: {value: 0.30, unit: share of homes adding a heat pump by 2030, source: "repo:runs/business_case_team_v2.txt:7",
               assumption: true, basis: "teammate scenario; said to follow New York 2030 targets, not verified"}
  loads:
    ev_l2_kw: {value: 7.2, unit: kW per unmanaged Level 2 charger, source: "repo:analysis/bess.py:13",
               assumption: true, basis: "charger rating used by the existing battery headroom rule"}
    hp_kw_per_degf: {value: 0.05, unit: kW added per F below the balance point, source: "fact:bess.headroom_rule.hp_kw_per_degf"}
    hp_balance_temp_f: {value: 60, unit: F, source: "repo:analysis/bess.py:174",
                        assumption: true, basis: "balance point used when the heat pump slope was fit"}
    ev_session_jump_kw: {value: 5.0, unit: kW above the day's 25th percentile that marks a charging hour,
                         source: "repo:analysis/classify.py:36"}
    ev_session_min_hours: {value: 2, unit: hours a charging block must be held, source: "repo:analysis/classify.py:37",
                           quote: "held 2+ hours"}
    ev_neutral_day_low_f: {value: 55, unit: F daily mean, source: "repo:analysis/classify.py:33"}
    ev_neutral_day_high_f: {value: 70, unit: F daily mean, source: "repo:analysis/classify.py:33"}

transformer:
  homes_per_transformer: {value: 8, unit: homes, source: "repo:docs/PROTOTYPE_PLAN.md:10",
                          assumption: true, basis: "decision D3, the teammate's group size; no meter map exists"}
  count: {value: 3000, unit: synthetic transformers, source: "repo:runs/business_case_team_v2.txt:5",
          assumption: true, basis: "teammate stress-test size"}
  sizing_margins: {value: [1.05, 1.15, 1.30, 1.50], unit: rating as a multiple of today's group peak,
                   source: "repo:docs/PROTOTYPE_PLAN.md:149", assumption: true,
                   basis: "sensitivity range answering judge objection 2; real ratings are an Avangrid ask"}
  base_margin: {value: 1.15, unit: rating as a multiple of today's group peak, source: "repo:runs/business_case_team_v2.txt:59",
                quote: "plus 15%", assumption: true, basis: "teammate default sizing"}
  overload_limit: {value: 1.20, unit: loading as a multiple of rating, source: "repo:runs/business_case_team_v2.txt:59",
                   assumption: true, basis: "teammate threshold; real loading limits are an Avangrid ask"}
  service_added_kva_max: {value: 3, unit: kVA added to a 200 A service without study, source: "pdf:challenge:3",
                          quote: "approximately 3 kVA"}

battery:
  energy_kwh_two_units: {value: 20.16, unit: kWh, source: "pdf:challenge:3"}
  energy_kwh_per_unit: {value: 10.08, unit: kWh, source: "pdf:challenge:3"}
  power_kw_two_units: {value: 7.68, unit: kW continuous, source: "pdf:challenge:3"}
  peak_kw_two_units: {value: 11.52, unit: kW for 10 seconds, source: "pdf:challenge:3"}
  round_trip_efficiency: {value: 0.894, unit: share of energy returned, source: "pdf:challenge:3"}
  life_years: {value: 15, unit: years of program warranty, source: "pdf:challenge:3"}
  units_per_host_max: {value: 2, unit: IQ 10C units per home, source: "pdf:challenge:3", quote: "(2 Units)"}
  start_soc_share: {value: 1.0, unit: share of capacity on the first hour of the data year, assumption: true,
                    basis: "the dispatch runs all year, so by February the state of charge comes from the run, not this start"}
  reserve_share: {value: 0.0, unit: share of capacity kept for the homeowner, assumption: true,
                  basis: "the utility may use full depth in an event; a homeowner backup reserve would cut usable energy"}
  export_to_neighbors: {value: false, unit: true or false, assumption: true,
                        basis: "a home battery covers only its own home's load, so a host cuts transformer load by at most what it draws"}
  coldsnap_hosts_per_transformer: {value: [1, 2], unit: host homes per flagged transformer, each with units_per_host_max,
                                   assumption: true, basis: "one or two hosts tested in M3; M4 picks hosts by fit score"}
  units_per_host_options: {value: [1, 2], unit: IQ 10C units per host home, source: "repo:docs/PROTOTYPE_PLAN.md:46",
                           quote: "1 or 2 units per host", assumption: true,
                           basis: "plan scope; the challenge program installs 2 units, 1 unit is tested as the cheaper size"}
  top_hours_per_season: {value: 20, unit: highest system hours per season, source: "repo:analysis/features.py:112",
                         basis: "same top-hour rule the existing pipeline uses for coincident peak"}
  winter_months: {value: [11, 12, 1, 2, 3], unit: months, source: "repo:analysis/features.py:111"}
  system_top_hour_counts: {value: [20, 50], unit: highest system hours of the whole year,
                          source: "repo:sources/qa/office-hours-2026-11-12-scott.txt:129", quote: "top 20, 30, 50"}
  summer_months: {value: [6, 7, 8], unit: months, source: "repo:analysis/features.py:111"}

shift:
  timer_start_hour: {value: 23, unit: hour of day (24 h), source: "repo:runs/business_case_team_v2.txt:35",
                     quote: "starts at 11pm", assumption: true, basis: "teammate timer mode"}
  stagger_start_hour: {value: 23, unit: hour of day (24 h), source: "repo:runs/business_case_team_v2.txt:35",
                       quote: "from 11pm to 3am", assumption: true, basis: "teammate staggered window"}
  stagger_end_hour: {value: 3, unit: hour of day (24 h), source: "repo:runs/business_case_team_v2.txt:35",
                     quote: "from 11pm to 3am", assumption: true, basis: "teammate staggered window"}
  stagger_power_share: {value: 0.5, unit: share of charger kW, source: "repo:runs/business_case_team_v2.txt:35",
                        quote: "at half power", assumption: true, basis: "teammate staggered mode"}

prices:
  upgrade_cost_usd: {value: 15000, unit: $ per transformer upgrade, source: "repo:runs/business_case_team_v2.txt:34",
                     assumption: true, basis: "teammate midpoint; credited to Eversource, page not verified"}
  upgrade_cost_low_usd: {value: 10000, unit: $ per transformer upgrade, source: "repo:runs/business_case_team_v2.txt:60",
                         assumption: true, basis: "teammate range; credited to Eversource, page not verified"}
  upgrade_cost_high_usd: {value: 20000, unit: $ per transformer upgrade, source: "repo:runs/business_case_team_v2.txt:60",
                          assumption: true, basis: "teammate range; credited to Eversource, page not verified"}
  capacity_value_usd_kw_yr: {value: 60, unit: $ per kW-year, source: "repo:runs/business_case_team_v2.txt:53",
                             assumption: true, basis: "teammate value credited to NYISO rest of state, not verified; the existing pipeline uses the next entry instead"}
  capacity_value_pipeline_usd_kw_yr: {value: 100.0, unit: $ per kW-year, source: "fact:assumption.capacity_value_usd_kw_yr",
                                      assumption: true, basis: "placeholder in the existing pipeline; disagrees with the teammate value above"}
  nyserda_incentive_usd_kwh: {value: 200, unit: $ per kWh installed, source: "repo:runs/business_case_team_v2.txt:60",
                              assumption: true, basis: "teammate value; NYSERDA eligibility for leased batteries is an Avangrid ask"}
  battery_unit_cost_low_usd: {value: 9000, unit: $ per IQ 10C installed, source: "fact:assumption.unit_cost_low_usd",
                              assumption: true, basis: "placeholder in the existing pipeline"}
  battery_unit_cost_high_usd: {value: 13000, unit: $ per IQ 10C installed, source: "fact:assumption.unit_cost_high_usd",
                               assumption: true, basis: "placeholder in the existing pipeline"}
  battery_lease_usd_month_two_units: {value: 55, unit: $ per month for two batteries, source: "citation:vermont-gmp-vpp",
                                      assumption: true, basis: "Green Mountain Power, Vermont, 10-year lease; applying it to NYSEG is our assumption"}
  managed_charging_enroll_usd: {value: 150, unit: $ per EV home once, source: "repo:runs/business_case_team_v2.txt:47",
                                assumption: true, basis: "teammate value credited to OptimizEV, not verified"}
  managed_charging_usd_yr: {value: 86, unit: $ per EV home per year, source: "repo:runs/business_case_team_v2.txt:47",
                            assumption: true, basis: "teammate value credited to OptimizEV, not verified"}
  transformer_life_years: {value: 30, unit: years, source: "repo:docs/PROTOTYPE_PLAN.md:152",
                           assumption: true, basis: "plan objection 5 says 30+ years; no utility source yet"}
  discount_rate: {value: 0.07, unit: share per year, assumption: true,
                  basis: "placeholder; no Avangrid cost of capital in our sources; M5 also reports a zero rate"}
  nyseg_electric_customers: {value: 890000, unit: customers, source: "citation:avangrid-utilities-2018",
                             assumption: true, basis: "2018 count of all NYSEG electric customers; the teammate treats it as homes"}

demo:
  scenario: {value: moderate, unit: scenario name, source: "repo:docs/PROTOTYPE_PLAN.md:78", assumption: true,
             basis: "the live screen command in the plan"}
  margin: {value: 1.15, unit: rating as a multiple of today's group peak, source: "repo:docs/PROTOTYPE_PLAN.md:78",
           assumption: true, basis: "the live screen command in the plan"}
  summer_peak_date: {value: "2026-07-02", unit: date, source: "repo:sources/qa/office-hours-2026-11-12-scott.txt:91",
                     quote: "July 2nd"}
  winter_peak_date: {value: "2026-02-07", unit: date, source: "repo:sources/qa/office-hours-2026-11-12-scott.txt:92",
                     quote: "February 7th"}
  cold_snap_start: {value: "2026-02-07", unit: date, source: "repo:docs/PROTOTYPE_PLAN.md:45", quote: "Feb 7-8"}
  cold_snap_end: {value: "2026-02-08", unit: date, source: "repo:docs/PROTOTYPE_PLAN.md:45", quote: "Feb 7-8"}
  picker_segments: {value: [ev_home, electric_heat, dual_electrified, summer_peaker, solar, baseline],
                    unit: segment names shown in the step 1 home picker, assumption: true,
                    basis: "one home per segment a program serves; in each, the home with the median annual kWh"}
  screen_seed: {value: 0, unit: random seed for the live screen command, assumption: true,
                basis: "seed 0 is the first of the seeds every milestone pools, so the live run is one of them"}

# Program eligibility for `ewu inventory`: a home qualifies when it has every flag in the rule and none of
# the excluded flags. Rules are this team's reading of the segment actions in analysis/segment.py.
programs:
  excluded_flags: {value: [is_other_inactive, is_other_seasonal], unit: flags that rule a home out of every program,
                   source: "repo:analysis/bess.py:93"}
  rules:
    managed_charging: {value: [is_ev_l2], unit: flags a home must all have, source: "repo:analysis/segment.py:39",
                       assumption: true, basis: "segment action: managed charging and an EV time-of-use rate"}
    service_upgrade_watch: {value: [is_ev_l2, is_electric_heat], unit: flags a home must all have,
                            source: "repo:analysis/segment.py:38", assumption: true,
                            basis: "segment action: first battery and service-upgrade watch list"}
    winter_demand_response: {value: [is_electric_heat], unit: flags a home must all have,
                             source: "repo:analysis/segment.py:40", assumption: true,
                             basis: "segment action: winter DR and weatherization"}
    heat_pump_conversion: {value: [is_resistance_heat], unit: flags a home must all have,
                           source: "repo:analysis/segment.py:40", quote: "resistance-to-heat-pump conversion",
                           assumption: true, basis: "the conversion the segment action names, offered to resistance-heat homes"}
    smart_thermostat: {value: [is_ac], unit: flags a home must all have, source: "repo:analysis/segment.py:41",
                       assumption: true, basis: "segment action: smart-thermostat DR"}
    pool_pump_timer: {value: [is_pool], unit: flags a home must all have, source: "repo:analysis/segment.py:41",
                      assumption: true, basis: "segment action: pool-pump timers"}
    solar_plus_storage: {value: [is_solar], unit: flags a home must all have, source: "repo:analysis/segment.py:37",
                         assumption: true, basis: "segment action: offer solar plus storage"}
    home_battery: {value: [is_bess_candidate], unit: flags a home must all have, source: "repo:analysis/bess.py:106",
                   quote: "event-window load >=3.5 kW", assumption: true,
                   basis: "the existing battery candidate rule; is_bess_candidate = a battery tier was assigned"}

checks:
  seeds: {value: 5, unit: random seeds, source: "repo:docs/PROTOTYPE_PLAN.md:198"}
  seed_tolerance_pts: {value: 1.5, unit: percentage points of overloaded share, source: "repo:docs/PROTOTYPE_PLAN.md:198"}
  energy_balance_tolerance_pct: {value: 0.1, unit: "% of energy moved", source: "repo:docs/PROTOTYPE_PLAN.md:200"}
  attribution_sum_tolerance_pts: {value: 0.01, unit: percentage points, assumption: true,
                                  basis: "rounding only; shares are computed exactly and must sum to 100"}
  module_line_cap: {value: 200, unit: lines per module, source: "repo:docs/PROTOTYPE_PLAN.md:158"}
  screen_seconds_max: {value: 60, unit: seconds, source: "repo:docs/PROTOTYPE_PLAN.md:78"}
  examiner_pass: {value: 9, unit: correct answers of 10, source: "repo:docs/PROTOTYPE_PLAN.md:237"}
  qa_questions: {value: 10, unit: questions in docs/CODE_QA.md, source: "repo:docs/PROTOTYPE_PLAN.md:104"}
  judge_anchor_score: {value: 4.14, unit: weighted judge score of anchor A1, source: "repo:docs/PROTOTYPE_PLAN.md:235"}
  judge_noise: {value: 0.1, unit: weighted score points, source: "repo:docs/PROTOTYPE_PLAN.md:240"}

