<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#ffffff"/><defs><marker id="head" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto"><path d="M0,2 L20,10 L0,18 z" fill="#1b1b1b"/></marker></defs><text x="60" y="84" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#1b1b1b" text-anchor="start">The engine runs on one laptop, offline, and every spec below was measured</text><text x="60" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#555555" text-anchor="start">Measured by deck/engine_specs.py on this machine; cold snap and grid runtimes as the engine recorded them</text><rect x="60" y="168" width="1800" height="816" fill="none" stroke="#1b1b1b" stroke-width="2"/><line x1="420" y1="168" x2="420" y2="984" stroke="#9a9a9a" stroke-width="1.5"/><text x="84" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b1b1b" text-anchor="start">Language</text><text x="444" y="212" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1b1b1b" text-anchor="start">Python 3.12.0; numpy 2.5.4, pandas 3.1.1, polars 2.1.0, scipy 1.18.1, pyarrow 26.0.1</text><line x1="60" y1="236" x2="1860" y2="236" stroke="#9a9a9a" stroke-width="1.5"/><text x="84" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b1b1b" text-anchor="start">Engine code</text><text x="444" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1b1b1b" text-anchor="start">2,799 lines in 21 ewu modules, none over 200</text><line x1="60" y1="304" x2="1860" y2="304" stroke="#9a9a9a" stroke-width="1.5"/><text x="84" y="348" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b1b1b" text-anchor="start">Pipeline, checks</text><text x="444" y="348" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1b1b1b" text-anchor="start">analysis 1,013 lines; checks 1,539; tests 1,626</text><line x1="60" y1="372" x2="1860" y2="372" stroke="#9a9a9a" stroke-width="1.5"/><text x="84" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b1b1b" text-anchor="start">Command line</text><text x="444" y="416" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1b1b1b" text-anchor="start">bin/ewu, 10 commands: inventory, screen, network, coldsnap, sensitivity, tophours, robustness, case, demo, plan</text><line x1="60" y1="440" x2="1860" y2="440" stroke="#9a9a9a" stroke-width="1.5"/><text x="84" y="484" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b1b1b" text-anchor="start">Input matrix</text><text x="444" y="484" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1b1b1b" text-anchor="start">33,757 homes x 8,760 hours, float32, 1.18 GB; full read 0.18 s</text><line x1="60" y1="508" x2="1860" y2="508" stroke="#9a9a9a" stroke-width="1.5"/><text x="84" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b1b1b" text-anchor="start">Live screen</text><text x="444" y="552" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1b1b1b" text-anchor="start">bin/ewu screen 2.4 s, full data (limit 60 s); peak memory 0.91 GB</text><line x1="60" y1="576" x2="1860" y2="576" stroke="#9a9a9a" stroke-width="1.5"/><text x="84" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b1b1b" text-anchor="start">Cold snap, grid</text><text x="444" y="620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1b1b1b" text-anchor="start">cold snap 61.9 s; sensitivity grid 173.2 s</text><line x1="60" y1="644" x2="1860" y2="644" stroke="#9a9a9a" stroke-width="1.5"/><text x="84" y="688" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b1b1b" text-anchor="start">Trust</text><text x="444" y="688" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1b1b1b" text-anchor="start">132 tests, 9 check scripts, make check exit 0 in 21 s</text><line x1="60" y1="712" x2="1860" y2="712" stroke="#9a9a9a" stroke-width="1.5"/><text x="84" y="756" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b1b1b" text-anchor="start">Runs on</text><text x="444" y="756" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1b1b1b" text-anchor="start">one MacBook Pro, Apple M2 Max, 64 GB; offline, no cloud</text><line x1="60" y1="780" x2="1860" y2="780" stroke="#9a9a9a" stroke-width="1.5"/><text x="84" y="824" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b1b1b" text-anchor="start">Action lists</text><text x="444" y="824" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1b1b1b" text-anchor="start">bin/ewu plan: transformer_actions.csv (3,000 rows), capital_plan.csv; home lists real only with --private</text><line x1="60" y1="848" x2="1860" y2="848" stroke="#9a9a9a" stroke-width="1.5"/><text x="84" y="892" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b1b1b" text-anchor="start">Avangrid's map</text><text x="444" y="892" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1b1b1b" text-anchor="start">one flag: --map CSV with meter_id, transformer_id, kva; on bin/ewu screen today, plan next</text><line x1="60" y1="916" x2="1860" y2="916" stroke="#9a9a9a" stroke-width="1.5"/><text x="84" y="960" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1b1b1b" text-anchor="start">Deployment</text><text x="444" y="960" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1b1b1b" text-anchor="start">scheduled batch job on Avangrid's data platform; no customer data leaves</text></svg>