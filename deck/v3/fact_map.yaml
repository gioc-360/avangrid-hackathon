about: 'Where each number of the D4G deck comes from in v3. Built by deck/v3/build_fact_map.py from outputs/deck/v3/numbers.csv; read by deck/v3/apply.py.
  Keys: facts/facts.json; cfg:path = config/ewu.yaml value; @name = aliases.peak_source.<selected>.name. Money is on the deck''s basis (upgrade
  at its full price), rebuilt from our counts.'
aliases:
  peak_source:
    selected: teammate_rerun
    why: 'teammate_rerun keeps Part 3 coherent: the 2,610 priority homes, her per-segment counts (slides 7, 10, A9), the scatter legend (slide
      9) and the July fleet chart (slide 10) all describe her ranking, and our audit''s rerun of her code on our load matrix gives the peak cut
      for exactly those homes. ''ours'' takes our engine''s own hosts (same 4 kW and 2 kW thresholds, our simulation) and peak drop; then those
      teammate-only numbers no longer add up to the host count and need a caption or new charts.'
    teammate_rerun:
      peak_mw: teammate.audit.rerun.fleet_priority.peak_cut_mw
      hosts: teammate.audit.rerun.priority_homes
    ours:
      peak_mw: ewu.deck.peakcut.export_peak_drop_mw
      hosts: ewu.deck.peakcut.hosts
claims:
- where: s29/5 A13 footer
  says: battery path cheaper before offsets at $15,000 or more per upgrade
  keys: null
  expr: gross('m', 120, 15000) < upall('m', 120, 15000) and gross('h', 120, 15000) < upall('h', 120, 15000)
- where: s29/5 A13 footer
  says: costlier before offsets in the high case at $10,000
  keys: null
  expr: gross('h', 120, 10000) > upall('h', 120, 10000)
- where: s11 verdict
  says: peak-only fleet does not pay on its own (benefit to cost below 1)
  keys:
    h: '@hosts'
    per: cfg:profiles.deck.units_per_host
    mw: '@peak_mw'
    unit: cfg:profiles.deck.battery_unit_usd
    lease: ewu.deck.prices.lease_pv_usd
    nyserda: cfg:profiles.deck.nyserda_usd_unit
    f: ewu.deck.prices.factor
  expr: (h * per * lease / 1e6 + mw * 1000 * 60 * f / 1e6 + h * per * nyserda / 1e6) / (h * per * unit / 1e6) < 1
- where: s12 title, s2
  says: 1 or 2 batteries fix most overloaded transformers
  keys:
    fm: ewu.deck.moderate.limit_120.fixed_of_overloaded_pct
    fh: ewu.deck.high.limit_120.fixed_of_overloaded_pct
  expr: fm > 50 and fh > 50
- where: s7 vs s2
  says: winter nights drive most future overloads
  keys:
    wm: ewu.deck.moderate.limit_120.winter_of_overloaded_pct
    wh: ewu.deck.high.limit_120.winter_of_overloaded_pct
  expr: wm > 50 and wh > 50
